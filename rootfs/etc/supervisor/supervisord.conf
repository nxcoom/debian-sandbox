[unix_http_server]
file=/home/container/sandbox/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/home/container/sandbox/logs/supervisord.log
pidfile=/home/container/sandbox/supervisor.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/container/sandbox/supervisor.sock

[include]
files=/home/container/sandbox/supervisor.d/*.conf /home/container/sandbox/services/*.conf
